services:
  postgres:
    image: postgres:16-alpine
    container_name: rankify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rankify
      POSTGRES_PASSWORD: rankify_secret
      POSTGRES_DB: rankify_db
    ports:
      - "5432:5432"
    volumes:
      - rankify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rankify -d rankify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rankify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rankify_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rankify_pgdata:
  rankify_redisdata:
